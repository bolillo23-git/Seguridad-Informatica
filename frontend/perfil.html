<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .portada {
            height: 250px;
            background-color: #ddd;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            overflow: hidden;
        }

        .foto-perfil {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border: 5px solid white;
            border-radius: 50%;
            margin-top: -80px;
            position: relative;
            z-index: 2;
        }

        .btn-camara {
            position: absolute;
            bottom: 10px;
            right: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            background: #e4e6eb;
            border: none;
            z-index: 3;
        }
    </style>
</head>

<body>

    <!-- Botón para regresar al muro -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-0">
        <div class="container">
            <a class="btn btn-light rounded-circle" href="muro.html"><i class="bi bi-arrow-left fs-5"></i></a>
        </div>
    </nav>

    <div class="container bg-white shadow-sm pb-4 mb-4">
        <!-- Portada -->
        <div class="row">
            <div class="col-12 px-0 position-relative">
                <div class="portada position-relative">
                    <img id="imgPortada" src="" class="w-100 h-100 object-fit-cover">
        
                    <!-- NUEVO: Botón oculto y botón visible para la portada -->
                    <input type="file" id="inputPortada" accept="image/*" style="display: none;">
                    <button class="btn btn-light btn-sm position-absolute shadow-sm fw-bold"
                        style="bottom: 15px; right: 15px; z-index: 5;"
                        onclick="document.getElementById('inputPortada').click()">
                        <i class="bi bi-camera-fill"></i> Cambiar portada
                    </button>
                </div>
            </div>
        </div>

        <!-- Sección de Foto y Nombre -->
        <div class="row px-3">
            <div class="col-12 d-flex flex-column align-items-center position-relative">

                <div class="position-relative">
                    <img id="imgPerfil" src="" class="foto-perfil shadow-sm">
                    <!-- Botón oculto para subir archivo -->
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                    <!-- Botón de cámara que activa el input -->
                    <button class="btn-camara d-flex justify-content-center align-items-center shadow-sm"
                        onclick="document.getElementById('inputFoto').click()">
                        <i class="bi bi-camera-fill fs-5"></i>
                    </button>
                </div>

                <h2 class="fw-bold mt-2 mb-0" id="nombrePerfil">Cargando...</h2>
                <p class="text-muted fw-semibold" id="estadisticasPerfil">-- amigos • -- publicaciones</p>

                <div class="d-flex gap-2 mt-2 w-100 justify-content-center">
                    <button class="btn btn-primary fw-bold px-4"><i class="bi bi-plus-circle"></i> Agregar a
                        historia</button>
                    <button class="btn btn-light fw-bold px-4 bg-secondary bg-opacity-10" data-bs-toggle="modal"
                        data-bs-target="#modalEditarPerfil" onclick="cargarDatosEdicion()">
                        <i class="bi bi-pencil"></i> Editar perfil
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección de Publicaciones -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h5 class="fw-bold mb-3">Mis Publicaciones</h5>
                <div id="contenedorMisPublicaciones">
                    <!-- Aquí irán los posts -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA EDITAR PERFIL -->
    <div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Editar Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPerfil">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre de usuario</label>
                            <input type="text" class="form-control" id="editNombre" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="editPassword"
                                placeholder="Déjalo en blanco si no quieres cambiarla">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold">Guardar Cambios</button>
                        </div>
                    </form>
    
                    <hr class="my-4">
    
                    <!-- Zona de peligro -->
                    <div class="d-grid">
                        <button type="button" class="btn btn-outline-danger fw-bold" onclick="eliminarCuenta()">
                            <i class="bi bi-trash3-fill"></i> Eliminar Cuenta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil.js"></script
</body>

</html>
